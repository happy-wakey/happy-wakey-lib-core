[package]
name = "happy-wakey-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Role-aware Happy Wakey domain and SeaORM core"
repository = "https://github.com/happy-wakey/happy-wakey-lib-core"

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
happy-wakey-interfaces = { git = "https://github.com/happy-wakey/happy-wakey-interfaces.git", rev = "d6278ec8f6b2263678728b147a32dff92d52d8c8" }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
