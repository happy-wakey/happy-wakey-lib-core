[package]
org = "happy-wakey"
name = "happy-wakey-lib-core"
version = "0.1.0"
description = "Role-aware Happy Wakey SeaORM, Drizzle, Prisma, GORM, and gRPC core"
license = "MIT"
keywords = ["alarms", "seaorm", "drizzle", "prisma", "gorm", "grpc"]

[package.repository]
vcs = "git"
url = "https://github.com/happy-wakey/happy-wakey-lib-core"

[dependencies]
"happy-wakey/happy-wakey-interfaces" = "^0.1.0"

[targets.repository]
dir = "."
adapter = "rust"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".zed/**", "zed_modules/**", "target/**", "drizzle/node_modules/**", "drizzle/dist/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --all-features --locked && python3 scripts/validate_polyglot_contracts.py"
